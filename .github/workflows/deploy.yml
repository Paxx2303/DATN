name: Deploy YOLO via GCP Workload Identity

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to VM via gcloud ssh
        run: |
          gcloud compute ssh instance-20260617-184557 \
            --zone=asia-east1-a \
            --project=project-d9243352-39fe-44a5-90d \
            --command='
              set -e
              command -v git  >/dev/null 2>&1 || sudo apt-get install -y git
              command -v docker >/dev/null 2>&1 || (curl -fsSL https://get.docker.com | sudo sh)
              if [ ! -d "$HOME/DATN" ]; then
                git clone https://github.com/Paxx2303/DATN.git "$HOME/DATN"
              fi
              cd "$HOME/DATN"
              git pull origin main

              echo "=== Disk TRUOC khi don ==="; df -h /
              sudo docker compose -f deploy/docker-compose.prod.yml down --remove-orphans || true
              sudo docker system prune -af || true
              sudo docker builder prune -af || true
              echo "=== Disk SAU khi don ==="; df -h /

              sudo docker compose -f deploy/docker-compose.prod.yml up --build -d
            '
