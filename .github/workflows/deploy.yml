name: Deploy to GCP (WIF Mode)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Package and Upload
        run: |
          # Chú ý: Vì code của bạn nằm trong thư mục fisheye_demo, 
          # chúng ta sẽ đóng gói nội dung bên trong đó.
          cd fisheye_demo
          tar --exclude='.git' \
              --exclude='venv' \
              --exclude='__pycache__' \
              --exclude='static/results/*' \
              --exclude='static/uploads/*' \
              -czf ../fisheye_deploy.tar.gz .
          cd ..

          gcloud compute scp fisheye_deploy.tar.gz ${{ secrets.GCP_INSTANCE_NAME }}:~/ --zone=${{ secrets.GCP_ZONE }}

      - name: Remote Deploy Execution
        run: |
          gcloud compute ssh ${{ secrets.GCP_INSTANCE_NAME }} --zone=${{ secrets.GCP_ZONE }} --command "
            mkdir -p ~/fisheye_app
            tar -xzf ~/fisheye_deploy.tar.gz -C ~/fisheye_app
            rm ~/fisheye_deploy.tar.gz
            cd ~/fisheye_app
            sudo docker compose -f deploy/docker-compose.prod.yml up --build -d
          "
